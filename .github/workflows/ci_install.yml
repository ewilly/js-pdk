name: "CI Install Script"

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2

    - name: Test Install Script (Linux)
      run: |
        ./install.sh
        extism-js --version
      if: runner.os != 'Windows'
